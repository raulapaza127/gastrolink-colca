<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hamburguesa 360 | GastroLink Colca</title><style>
:root{--green:#173a35;--gold:#e5b66b;--paper:#fffdf8;--sand:#f4eee3;--ink:#20332f}*{box-sizing:border-box}body{margin:0;background:var(--sand);color:var(--ink);font-family:Arial,sans-serif}.top{padding:22px 20px;background:var(--green);color:#fff}.top div,.page{max-width:920px;margin:auto}.brand{font:700 1.35rem Georgia,serif}.brand b{color:var(--gold)}.page{padding:38px 20px 55px}.crumb{font-size:.75rem;text-transform:uppercase;letter-spacing:1.5px;color:#9c684a;font-weight:bold}h1{font:clamp(2.3rem,6vw,4rem)/1 Georgia,serif;margin:9px 0}.lead{max-width:600px;line-height:1.6;color:#60706a}.viewer{background:#111;border-radius:16px;overflow:hidden;margin-top:28px;position:relative;touch-action:none;user-select:none}.viewer img{width:100%;height:min(63vw,560px);object-fit:contain;display:block}.guide{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:#000b;color:#fff;border:1px solid #ffffff40;border-radius:99px;padding:9px 14px;font-size:.84rem;white-space:nowrap}.controls{display:flex;justify-content:center;gap:12px;padding:15px;background:#17221f}.controls button{border:1px solid #ffffff45;background:transparent;color:#fff;border-radius:8px;padding:9px 16px;font-weight:bold}.info{background:var(--paper);box-shadow:0 10px 28px #32261110;margin-top:25px;padding:25px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}.price{font-size:1.45rem;font-weight:bold;color:var(--green)}.ingredients{margin-top:10px;line-height:1.6;color:#5b6b65}.counter{text-align:center;margin:14px 0 0;font-size:.82rem;color:#66746f}@media(max-width:560px){.info{grid-template-columns:1fr}.viewer img{height:75vw}.guide{font-size:.75rem}.page{padding-top:28px}}</style></head>
<body><header class="top"><div class="brand">Gastro<b>Link</b> Colca</div></header><main class="page"><div class="crumb">Vista interactiva del plato</div><h1>Hamburguesa especial</h1><p class="lead">Explora la hamburguesa desde distintos ángulos. Arrastra la foto con el dedo o con el mouse para girar la vista.</p><section class="viewer" id="viewer"><img id="spin" src="assets/hamburguesa-01.jpeg" alt="Hamburguesa especial, vista 1 de 16"><div class="guide">← Arrastra para girar →</div><div class="controls"><button onclick="move(-1)">← Anterior</button><button onclick="move(1)">Siguiente →</button></div></section><div class="counter" id="counter">Vista 1 de 16</div><section class="info"><div><div class="crumb">Información del plato</div><div class="ingredients"><b>Ingredientes:</b> pan, papas, carne y tomate.</div></div><div class="price">S/ 12.50</div></section></main><script>const total=16,spin=document.querySelector('#spin'),counter=document.querySelector('#counter'),viewer=document.querySelector('#viewer');let i=0,startX=0,startI=0,dragging=false;function show(n){i=(n+total)%total;let f=String(i+1).padStart(2,'0');spin.src='assets/hamburguesa-'+f+'.jpeg';spin.alt='Hamburguesa especial, vista '+(i+1)+' de '+total;counter.textContent='Vista '+(i+1)+' de '+total}function move(n){show(i+n)}viewer.addEventListener('pointerdown',e=>{dragging=true;startX=e.clientX;startI=i;viewer.setPointerCapture(e.pointerId)});viewer.addEventListener('pointermove',e=>{if(!dragging)return;let delta=e.clientX-startX;let steps=Math.round(delta/28);show(startI-steps)});viewer.addEventListener('pointerup',()=>dragging=false);viewer.addEventListener('pointercancel',()=>dragging=false);</script></body></html>
